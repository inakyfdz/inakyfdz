<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-label="Full Stack - Desarrollo de Aplicaciones Web" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .cur{animation:blink 1s steps(1) infinite}
